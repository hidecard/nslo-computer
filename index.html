
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NSLO Computer - Myanmar Learning Roadmap</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Pyidaungsu:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg-surface: #ffffff;
            --bg-app: #fcfcfd;
            --text-main: #101828;
            --text-secondary: #475467;
            --border-soft: #eaecf0;
            --shadow-sm: 0px 1px 2px rgba(16, 24, 40, 0.05);
        }

        body {
            font-family: 'Plus Jakarta Sans', 'Pyidaungsu', sans-serif;
            background-color: var(--bg-app);
            color: var(--text-main);
            -webkit-font-smoothing: antialiased;
        }

        .myanmar-text {
            font-family: 'Pyidaungsu', sans-serif;
            line-height: 1.8;
        }

        /* Smooth UI Transitions */
        .transition-standard {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Glassmorphism Sidebar */
        .sidebar-glass {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(12px);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #d0d5dd;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #98a2b3;
        }

        /* Enhanced Markdown Styling */
        .prose {
            max-width: none;
            color: var(--text-secondary);
        }
        .prose h3 {
            color: var(--text-main);
            font-weight: 700;
            font-size: 1.5rem;
            margin-top: 2rem;
            margin-bottom: 1rem;
        }
        .prose p {
            margin-bottom: 1.25rem;
            line-height: 1.75;
        }
        .prose table {
            width: 100%;
            border-collapse: collapse;
            margin: 1.5rem 0;
            border: 1px solid var(--border-soft);
            border-radius: 8px;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }
        .prose th {
            background-color: #f9fafb;
            text-align: left;
            padding: 12px 16px;
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--text-secondary);
            border-bottom: 1px solid var(--border-soft);
            white-space: nowrap;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        .prose td {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border-soft);
            font-size: 0.875rem;
            white-space: normal;
            word-wrap: break-word;
        }

        /* Mobile responsive table adjustments */
        @media (max-width: 768px) {
            .prose table {
                font-size: 0.8rem;
                margin: 1rem -0.5rem;
                border-radius: 4px;
                border-left: none;
                border-right: none;
                min-width: 600px; /* Ensure minimum width for scrolling */
            }
            .prose th,
            .prose td {
                padding: 10px 12px;
                min-width: 120px;
            }
            .prose th {
                font-size: 0.8rem;
                font-weight: 700;
            }
            .prose td {
                font-size: 0.8rem;
            }
        }

        @media (max-width: 640px) {
            .prose table {
                margin: 1rem -1rem;
                min-width: 500px;
            }
            .prose th,
            .prose td {
                padding: 8px 10px;
                min-width: 100px;
            }
        }

        @media (max-width: 480px) {
            .prose table {
                margin: 1rem -1.5rem;
                min-width: 400px;
            }
            .prose th,
            .prose td {
                padding: 6px 8px;
                min-width: 80px;
                font-size: 0.75rem;
            }
            .prose th {
                font-size: 0.75rem;
            }
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        @keyframes slideInUp {
            from { transform: translateY(10px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .animate-slide-up {
            animation: slideInUp 0.4s ease-out forwards;
        }
    </style>
<script src="https://js.puter.com/v2/"></script>
